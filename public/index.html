<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>Video Launcher</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#app">Zum Inhalt springen</a>

  <header id="masthead" class="masthead">
    <div class="mh-start">
      <button class="icon-btn" id="guide-btn" aria-label="Navigation"></button>
      <a href="/" class="logo" id="logo" aria-label="Startseite">
        <span class="logo-icon"></span><span class="logo-text">Video Launcher</span>
      </a>
    </div>
    <div class="mh-center">
      <button class="icon-btn mh-back" id="search-back" aria-label="Zurück"></button>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <div class="search-box">
          <span class="search-icon-inline"></span>
          <input id="search-input" name="search_query" type="search" placeholder="Suchen" aria-label="Suchen" enterkeyhint="search" spellcheck="false">
          <button type="button" class="icon-btn search-clear" id="search-clear" aria-label="Suche löschen"></button>
        </div>
        <button type="submit" class="search-btn" aria-label="Suchen"></button>
        <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
      </form>
      <button class="icon-btn voice-btn" id="voice-btn" aria-label="Sprachsuche"></button>
    </div>
    <div class="mh-end">
      <button class="icon-btn mh-search-toggle" id="search-toggle" aria-label="Suchen"></button>
      <button class="icon-btn notif-btn" id="notif-btn" aria-label="Benachrichtigungen" hidden><span class="badge" id="notif-badge" hidden></span></button>
      <button class="avatar-btn" id="account-btn" aria-label="Konto"></button>
    </div>
  </header>

  <div class="guide-scrim" id="guide-scrim" hidden></div>
  <nav id="guide" class="guide" aria-label="Hauptnavigation"></nav>
  <nav id="mini-guide" class="mini-guide" aria-label="Kurznavigation"></nav>

  <main id="app" class="app" tabindex="-1"></main>

  <nav id="pivot-bar" class="pivot-bar" aria-label="Navigation"></nav>

  <div id="miniplayer" class="miniplayer" hidden></div>
  <div id="player-host" class="player-host"></div>
  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/shaka-player.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
