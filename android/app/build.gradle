plugins {
    id 'com.android.application'
}

// Versionsnummer kommt aus der CI (Anzahl der Commits), lokal 1.
def ciVersionCode = (System.getenv('VL_VERSION_CODE') ?: '1') as Integer
def ciVersionName = System.getenv('VL_VERSION_NAME') ?: '1.0.0'

android {
    namespace 'de.videolauncher.app'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'de.videolauncher.app'
        minSdk 24
        targetSdk 34
        versionCode ciVersionCode
        versionName ciVersionName

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags ''
            }
        }
    }

    // Eine APK pro Prozessor-Architektur (libnode ist groß).
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv('VL_KEYSTORE_FILE')
            if (ks && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('VL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('VL_KEY_ALIAS')
                keyPassword System.getenv('VL_KEY_PASSWORD')
            } else {
                // Ohne eigenen Schlüssel: mit dem Debug-Schlüssel signieren.
                def debugKs = new File(System.getProperty('user.home'), '.android/debug.keystore')
                storeFile debugKs
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs 'libnode/bin/'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
