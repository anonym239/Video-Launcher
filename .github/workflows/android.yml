# Baut die Android-App (APK) und veröffentlicht sie als GitHub-Release "latest".
name: Android-APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Node-Projekt und libnode vorbereiten
        run: node scripts/prepare-android.mjs

      # Gleicher Signaturschlüssel für alle Builds, damit Updates ohne Neuinstallation gehen.
      # Eigener Schlüssel: Secrets VL_KEYSTORE_BASE64, VL_KEYSTORE_PASSWORD, VL_KEY_ALIAS, VL_KEY_PASSWORD.
      - name: Signaturschlüssel aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vl-signing-key-v1

      - name: Signatur vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.VL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VL_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Video Launcher,O=Video Launcher,C=DE"
          fi

      - name: APK bauen
        working-directory: android
        env:
          VL_KEYSTORE_PASSWORD: ${{ secrets.VL_KEYSTORE_PASSWORD }}
          VL_KEY_ALIAS: ${{ secrets.VL_KEY_ALIAS }}
          VL_KEY_PASSWORD: ${{ secrets.VL_KEY_PASSWORD }}
          VL_VERSION_CODE: ${{ github.run_number }}
          VL_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK einsammeln
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/VideoLauncher.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: VideoLauncher-APK
          path: dist/*.apk

  # Startet die APK auf einem echten Android-Emulator und prüft, ob sie läuft.
  smoketest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VideoLauncher-APK
          path: dist

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App im Emulator starten (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-smoketest.sh dist/VideoLauncher.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Smoketest
          path: smoketest/

  release:
    needs: [build, smoketest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoLauncher-APK
          path: dist

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/VideoLauncher.apk \
            --target "$GITHUB_SHA" \
            --title "Video Launcher 1.0.${{ github.run_number }}" \
            --latest \
            --notes "Einfach **VideoLauncher.apk** herunterladen, öffnen und installieren – fertig. Funktioniert auf allen Android-Handys ab Android 7.

          Beim ersten Mal fragt Android, ob Installationen aus dieser Quelle erlaubt sind → erlauben.
          Diese Version wurde automatisch auf einem Android-14-Emulator gestartet und getestet.
          Unabhängiges Open-Source-Projekt, nicht mit YouTube/Google verbunden."
